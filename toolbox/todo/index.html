<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script src="/assets/coming-soon.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="リスト・日時・繰り返し・フラグ・優先度・サブタスクに対応したリマインダー。タスクは、この端末に保存されます。">
<meta name="theme-color" content="#f9faef" id="theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Todo">
<title>Todo — リマインダー・ToDo リスト | SK's Toolbox</title>
<!-- 検索とシェアのための情報（正式な URL・カード・アプリの情報） -->
<link rel="canonical" href="https://sk-hub.jp/toolbox/todo/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SK's Toolbox">
<meta property="og:locale" content="ja_JP">
<meta property="og:title" content="Todo — リマインダー・ToDo リスト | SK&#x27;s Toolbox">
<meta property="og:description" content="リスト・日時・繰り返し・フラグ・優先度・サブタスクに対応したリマインダー。タスクは、この端末に保存されます。">
<meta property="og:url" content="https://sk-hub.jp/toolbox/todo/">
<meta property="og:image" content="https://sk-hub.jp/toolbox/todo/icon-512.png">
<meta name="twitter:card" content="summary">
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebApplication", "name": "Todo — SK's Toolbox", "url": "https://sk-hub.jp/toolbox/todo/", "description": "リスト・日時・繰り返し・フラグ・優先度・サブタスクに対応したリマインダー。タスクは、この端末に保存されます。", "applicationCategory": "ProductivityApplication", "operatingSystem": "Web", "inLanguage": "ja", "isAccessibleForFree": true, "offers": {"@type": "Offer", "price": "0", "priceCurrency": "JPY"}, "image": "https://sk-hub.jp/toolbox/todo/icon-512.png", "isPartOf": {"@type": "WebSite", "name": "SK's Toolbox", "url": "https://sk-hub.jp/toolbox/"}, "author": {"@type": "Person", "name": "SK", "url": "https://sk-hub.jp/"}}</script>
<!-- 多言語: /lang/ で選んだ言語で表示する（/assets/i18n.js。body の最後で translatePage()） -->
<script src="/assets/i18n.js"></script>
<!-- 文字は M PLUS 1、アイコンは Material Symbols（Google のマテリアルデザイン） -->
<script src="/assets/fonts.js" data-fonts="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@300;400;500;700&display=swap" data-icons="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"></script>
<link rel="stylesheet" href="/toolbox/shared/m3.css">
<link rel="stylesheet" href="todo.css">
<!-- SK's Toolbox の共通の設定（テーマ・テーマカラー・動きを減らす…）。設定の画面もここ -->
<script src="/toolbox/shared/settings.js" data-app="todo"></script>
<!-- マテリアルデザインの部品（波紋・ダイアログ・動き） -->
<script src="/toolbox/shared/m3.js"></script>
<!-- パソコンでアプリとして入れたときのタイトルバー（画面の切りかえでも動かさないよう、最初から入れる） -->
<script src="/toolbox/shared/titlebar.js"></script>
<!-- タイトルバーの真ん中（コマンドバー・アイランドなど。Toolbox の設定で選ぶ） -->
<script src="/toolbox/shared/tbcenter.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <div class="app" id="app">
    <!-- リストの一覧（スマートリストとマイリスト） -->
    <aside class="side" aria-label="リスト">
      <header class="app-bar">
        <a class="tb-back m3-state" href="/toolbox/" aria-label="SK's Toolbox に戻る"><span class="msr" aria-hidden="true">arrow_back</span><span>SK's Toolbox</span></a>
        <span class="app-bar__space"></span>
        <button type="button" class="icon-btn m3-state" data-install hidden aria-label="アプリとして追加" title="アプリとして追加"><span class="msr" aria-hidden="true">install_mobile</span></button>
        <button type="button" class="icon-btn m3-state" data-open-settings aria-label="Toolbox の設定" title="Toolbox の設定"><span class="msr" aria-hidden="true">settings</span></button>
        <div class="menu-wrap">
          <button type="button" class="icon-btn m3-state" id="btn-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" aria-label="その他" title="その他"><span class="msr" aria-hidden="true">more_vert</span></button>
          <div class="menu" id="menu" role="menu" hidden>
            <button type="button" class="m3-state" role="menuitem" data-menu="notify"><span class="msr" aria-hidden="true">notifications</span><span id="notify-label" data-i18n-skip></span></button>
            <hr>
            <button type="button" class="m3-state" role="menuitem" data-menu="export"><span class="msr" aria-hidden="true">download</span><span>バックアップを書き出す</span></button>
            <button type="button" class="m3-state" role="menuitem" data-menu="import"><span class="msr" aria-hidden="true">upload</span><span>バックアップを読み込む</span></button>
          </div>
          <input type="file" id="import-file" accept="application/json,.json" hidden>
        </div>
      </header>

      <label class="search">
        <span class="msr" aria-hidden="true">search</span>
        <input type="search" id="search" placeholder="検索" aria-label="リマインダーを検索" autocomplete="off">
      </label>

      <div class="smart" id="smart" data-i18n-skip></div>

      <h2 class="side__head">マイリスト</h2>
      <div class="lists" id="lists" data-i18n-skip></div>
      <button type="button" class="text-btn add-list m3-state" id="btn-add-list"><span class="msr" aria-hidden="true">add</span><span>リストを追加</span></button>

      <p class="side__note">タスクはこの端末のブラウザに保存されます（オンライン同期は任意）。通知は、Toolbox のページを開いているあいだだけ届きます。</p>
    </aside>

    <!-- 選んだリスト -->
    <main class="main" id="main">
      <header class="app-bar main__bar">
        <button type="button" class="icon-btn m3-state main__back" id="btn-back" aria-label="リストの一覧に戻る"><span class="msr" aria-hidden="true">arrow_back</span></button>
        <span class="app-bar__space"></span>
        <button type="button" class="icon-btn m3-state" id="btn-cal" hidden aria-pressed="false" aria-label="カレンダーで見る" title="カレンダーで見る"><span class="msr" aria-hidden="true">calendar_month</span></button>
        <div class="menu-wrap">
          <button type="button" class="icon-btn m3-state" id="btn-list-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="list-menu" aria-label="リストのメニュー" title="リストのメニュー"><span class="msr" aria-hidden="true">more_horiz</span></button>
          <div class="menu" id="list-menu" role="menu" hidden>
            <button type="button" class="m3-state" role="menuitem" data-lmenu="sort"><span class="msr" aria-hidden="true">sort</span><span>並べ替え</span></button>
            <button type="button" class="m3-state" role="menuitem" data-lmenu="toggle-done"><span class="msr" aria-hidden="true" id="toggle-done-icon">visibility</span><span id="toggle-done-label" data-i18n-skip></span></button>
            <button type="button" class="m3-state" role="menuitem" data-lmenu="clear-done"><span class="msr" aria-hidden="true">delete_sweep</span><span>完了済みを削除</span></button>
            <hr data-user-list>
            <button type="button" class="m3-state" role="menuitem" data-lmenu="edit-list" data-user-list><span class="msr" aria-hidden="true">edit</span><span>リストを編集</span></button>
            <button type="button" class="m3-state" role="menuitem" data-lmenu="delete-list" data-user-list><span class="msr" aria-hidden="true">delete</span><span>リストを削除</span></button>
          </div>
        </div>
      </header>
      <div class="main__scroll" id="scroll">
        <div class="main__head">
          <h1 class="main__title" id="title" data-i18n-skip></h1>
          <span class="main__count" id="count" data-i18n-skip></span>
        </div>
        <div class="done-bar" id="done-bar" hidden data-i18n-skip></div>
        <div class="tasks" id="tasks" data-i18n-skip></div>
        <div class="empty" id="empty" hidden>
          <span class="msr" aria-hidden="true" id="empty-icon">task_alt</span>
          <p id="empty-text" data-i18n-skip></p>
        </div>
      </div>
      <button type="button" class="new-btn m3-state" id="btn-new"><span class="msr" aria-hidden="true">add_circle</span><span>新規リマインダー</span></button>
    </main>
  </div>

  <!-- スナックバー（「元に戻す」つき） -->
  <div class="snackbar" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" class="text-btn m3-state" id="toast-action" hidden>元に戻す</button></div>

  <script src="/toolbox/shared/remind.js"></script>
  <script src="todo.js"></script>
  <script>window.SKI18N && SKI18N.translatePage();</script>
  <!-- 横断検索（Ctrl+K） -->
  <script src="/toolbox/shared/search.js"></script>
  <!-- LINE の中で開いたとき（LINE ミニアプリ）と「LINE で送る」 -->
  <script src="/toolbox/shared/line.js"></script>
  <script src="/toolbox/shared/pwa.js"></script>
  <script src="/assets/maintenance.js" defer></script>
</body>
