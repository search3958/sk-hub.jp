<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script src="/assets/coming-soon.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="書式・チェックリスト・表・画像に対応したメモ帳。フォルダで整理できます。メモは、この端末に保存されます。">
<meta name="theme-color" content="#f8ece4" id="theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Memo">
<title>Memo — 画像も入るメモ帳 | SK's Toolbox</title>
<!-- 検索とシェアのための情報（正式な URL・カード・アプリの情報） -->
<link rel="canonical" href="https://sk-hub.jp/toolbox/memo/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SK's Toolbox">
<meta property="og:locale" content="ja_JP">
<meta property="og:title" content="Memo — 画像も入るメモ帳 | SK&#x27;s Toolbox">
<meta property="og:description" content="書式・チェックリスト・表・画像に対応したメモ帳。フォルダで整理できます。メモは、この端末に保存されます。">
<meta property="og:url" content="https://sk-hub.jp/toolbox/memo/">
<meta property="og:image" content="https://sk-hub.jp/toolbox/memo/icon-512.png">
<meta name="twitter:card" content="summary">
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebApplication", "name": "Memo — SK's Toolbox", "url": "https://sk-hub.jp/toolbox/memo/", "description": "書式・チェックリスト・表・画像に対応したメモ帳。フォルダで整理できます。メモは、この端末に保存されます。", "applicationCategory": "ProductivityApplication", "operatingSystem": "Web", "inLanguage": "ja", "isAccessibleForFree": true, "offers": {"@type": "Offer", "price": "0", "priceCurrency": "JPY"}, "image": "https://sk-hub.jp/toolbox/memo/icon-512.png", "isPartOf": {"@type": "WebSite", "name": "SK's Toolbox", "url": "https://sk-hub.jp/toolbox/"}, "author": {"@type": "Person", "name": "SK", "url": "https://sk-hub.jp/"}}</script>
<!-- 多言語: /lang/ で選んだ言語で表示する（/assets/i18n.js。body の最後で translatePage()） -->
<script src="/assets/i18n.js"></script>
<!-- 文字は M PLUS 1（等幅は M PLUS 1 Code）、アイコンは Material Symbols（Google のマテリアルデザイン） -->
<script src="/assets/fonts.js" data-fonts="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@300;400;500;700&family=M+PLUS+1+Code:wght@400;500&display=swap" data-icons="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"></script>
<link rel="stylesheet" href="/toolbox/shared/m3.css">
<link rel="stylesheet" href="memo.css">
<!-- SK's Toolbox の共通の設定（テーマ・テーマカラー・動きを減らす…）。設定の画面もここ -->
<script src="/toolbox/shared/settings.js" data-app="memo"></script>
<!-- マテリアルデザインの部品（波紋・ダイアログ・動き） -->
<script src="/toolbox/shared/m3.js"></script>
<!-- パソコンでアプリとして入れたときのタイトルバー（画面の切りかえでも動かさないよう、最初から入れる） -->
<script src="/toolbox/shared/titlebar.js"></script>
<!-- タイトルバーの真ん中（コマンドバー・アイランドなど。Toolbox の設定で選ぶ） -->
<script src="/toolbox/shared/tbcenter.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <div class="app" id="app">
    <!-- メモの一覧 -->
    <aside class="side" aria-label="メモの一覧">
      <header class="app-bar">
        <a class="tb-back m3-state" href="/toolbox/" aria-label="SK's Toolbox に戻る"><span class="msr" aria-hidden="true">arrow_back</span><span>SK's Toolbox</span></a>
        <span class="app-bar__space"></span>
        <button type="button" class="icon-btn m3-state" data-install hidden aria-label="アプリとして追加" title="アプリとして追加"><span class="msr" aria-hidden="true">install_mobile</span></button>
        <button type="button" class="icon-btn m3-state" data-open-settings aria-label="Toolbox の設定" title="Toolbox の設定"><span class="msr" aria-hidden="true">settings</span></button>
        <div class="menu-wrap">
          <button type="button" class="icon-btn m3-state" id="btn-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" aria-label="その他" title="その他"><span class="msr" aria-hidden="true">more_vert</span></button>
          <div class="menu" id="menu" role="menu" hidden>
            <button type="button" class="m3-state" role="menuitem" data-menu="new-folder"><span class="msr" aria-hidden="true">create_new_folder</span><span>新しいフォルダ</span></button>
            <button type="button" class="m3-state" role="menuitem" data-menu="rename-folder" data-user-folder><span class="msr" aria-hidden="true">drive_file_rename_outline</span><span>フォルダの名前を変更</span></button>
            <button type="button" class="m3-state" role="menuitem" data-menu="delete-folder" data-user-folder><span class="msr" aria-hidden="true">folder_delete</span><span>フォルダを削除</span></button>
            <button type="button" class="m3-state" role="menuitem" data-menu="lock-all"><span class="msr" aria-hidden="true">lock</span><span>ロックしたメモをすべて閉じる</span></button>
            <button type="button" class="m3-state" role="menuitem" data-menu="empty-trash" data-trash-only><span class="msr" aria-hidden="true">delete_forever</span><span>最近削除した項目を空にする</span></button>
            <hr>
            <button type="button" class="m3-state" role="menuitem" data-menu="sort"><span class="msr" aria-hidden="true">sort</span><span>並べ替え</span></button>
            <button type="button" class="m3-state" role="menuitem" data-menu="export"><span class="msr" aria-hidden="true">download</span><span>バックアップを書き出す</span></button>
            <button type="button" class="m3-state" role="menuitem" data-menu="import"><span class="msr" aria-hidden="true">upload</span><span>バックアップを読み込む</span></button>
          </div>
          <input type="file" id="import-file" accept="application/json,.json" hidden>
        </div>
      </header>

      <h1 class="side__title"><span id="folder-title">Memo</span> <small id="folder-count" data-i18n-skip></small></h1>
      <label class="search">
        <span class="msr" aria-hidden="true">search</span>
        <input type="search" id="search" placeholder="すべてのメモを検索" aria-label="すべてのメモを検索" autocomplete="off">
      </label>
      <!-- フォルダ（フィルターチップ） -->
      <div class="folders" id="folders" role="radiogroup" aria-label="フォルダ" data-i18n-skip></div>

      <div class="list" id="list" data-i18n-skip></div>
      <div class="list__empty" id="list-empty" hidden>
        <span class="msr" aria-hidden="true">sticky_note_2</span>
        <p id="list-empty-text" data-i18n-skip></p>
      </div>
      <p class="side__note">メモはこの端末のブラウザに保存されます（オンライン同期は任意。画像は同期しません）。大切なメモは、ときどきバックアップを書き出してください。</p>

      <button type="button" class="fab m3-state" id="btn-new" aria-label="新しいメモ"><span class="msr" aria-hidden="true">edit_square</span><span class="fab__label">新しいメモ</span></button>
    </aside>

    <!-- 書くところ -->
    <main class="editor" id="editor">
      <header class="app-bar editor__bar">
        <button type="button" class="icon-btn m3-state editor__back" id="btn-back" aria-label="メモの一覧に戻る"><span class="msr" aria-hidden="true">arrow_back</span></button>
        <span class="editor__status" id="status" aria-live="polite" data-i18n-skip></span>
        <span class="app-bar__space"></span>
        <!-- ふつうのメモ -->
        <span class="editor__actions" id="note-actions">
          <button type="button" class="icon-btn m3-state" id="btn-pin" aria-pressed="false" aria-label="ピン留め" title="ピン留め"><span class="msr" aria-hidden="true">push_pin</span></button>
          <button type="button" class="icon-btn m3-state" id="btn-lock" aria-pressed="false" aria-label="ロック" title="ロック"><span class="msr" aria-hidden="true">lock_open</span></button>
          <button type="button" class="icon-btn m3-state" id="btn-move" aria-label="フォルダに移動" title="フォルダに移動"><span class="msr" aria-hidden="true">drive_file_move</span></button>
          <button type="button" class="icon-btn m3-state" id="btn-share" aria-label="共有・書き出し" title="共有・書き出し"><span class="msr" aria-hidden="true">ios_share</span></button>
          <button type="button" class="icon-btn m3-state" id="btn-delete" aria-label="このメモを削除" title="このメモを削除"><span class="msr" aria-hidden="true">delete</span></button>
        </span>
        <!-- 最近削除した項目のメモ -->
        <span class="editor__actions" id="trash-actions" hidden>
          <button type="button" class="text-btn m3-state" id="btn-restore"><span class="msr" aria-hidden="true">restore_from_trash</span><span>元に戻す</span></button>
          <button type="button" class="text-btn tbs-danger m3-state" id="btn-destroy">完全に削除</button>
        </span>
      </header>

      <div class="editor__scroll" id="scroll">
        <p class="editor__date" id="date-line" data-i18n-skip></p>
        <div class="doc" id="doc" contenteditable="true" role="textbox" aria-multiline="true" aria-label="メモの本文" spellcheck="false" data-placeholder="ここに書く（1 行目がタイトルになります）" data-i18n-skip></div>
      </div>

      <!-- 書式のツールバー -->
      <div class="fmt" id="fmt" role="toolbar" aria-label="書式">
        <div class="fmt__row">
          <button type="button" class="fmt__btn m3-state" data-cmd="style" aria-haspopup="menu" aria-label="段落のスタイル" title="段落のスタイル"><span class="msr" aria-hidden="true">format_size</span></button>
          <span class="fmt__sep"></span>
          <button type="button" class="fmt__btn m3-state" data-cmd="bold" aria-pressed="false" aria-label="太字" title="太字（Ctrl+B）"><span class="msr" aria-hidden="true">format_bold</span></button>
          <button type="button" class="fmt__btn m3-state" data-cmd="italic" aria-pressed="false" aria-label="斜体" title="斜体（Ctrl+I）"><span class="msr" aria-hidden="true">format_italic</span></button>
          <button type="button" class="fmt__btn m3-state" data-cmd="underline" aria-pressed="false" aria-label="下線" title="下線（Ctrl+U）"><span class="msr" aria-hidden="true">format_underlined</span></button>
          <button type="button" class="fmt__btn m3-state" data-cmd="strikeThrough" aria-pressed="false" aria-label="取り消し線" title="取り消し線"><span class="msr" aria-hidden="true">format_strikethrough</span></button>
          <button type="button" class="fmt__btn m3-state" data-cmd="highlight" aria-pressed="false" aria-label="マーカー" title="マーカー"><span class="msr" aria-hidden="true">ink_highlighter</span></button>
          <span class="fmt__sep"></span>
          <button type="button" class="fmt__btn m3-state" data-cmd="checklist" aria-pressed="false" aria-label="チェックリスト" title="チェックリスト"><span class="msr" aria-hidden="true">checklist</span></button>
          <button type="button" class="fmt__btn m3-state" data-cmd="insertUnorderedList" aria-pressed="false" aria-label="箇条書き" title="箇条書き"><span class="msr" aria-hidden="true">format_list_bulleted</span></button>
          <button type="button" class="fmt__btn m3-state" data-cmd="insertOrderedList" aria-pressed="false" aria-label="番号付きリスト" title="番号付きリスト"><span class="msr" aria-hidden="true">format_list_numbered</span></button>
          <button type="button" class="fmt__btn m3-state" data-cmd="outdent" aria-label="字下げを戻す" title="字下げを戻す"><span class="msr" aria-hidden="true">format_indent_decrease</span></button>
          <button type="button" class="fmt__btn m3-state" data-cmd="indent" aria-label="字下げ" title="字下げ"><span class="msr" aria-hidden="true">format_indent_increase</span></button>
          <span class="fmt__sep"></span>
          <button type="button" class="fmt__btn m3-state" data-cmd="table" aria-label="表" title="表"><span class="msr" aria-hidden="true">table</span></button>
          <button type="button" class="fmt__btn m3-state" data-cmd="image" aria-label="画像" title="画像"><span class="msr" aria-hidden="true">image</span></button>
          <button type="button" class="fmt__btn m3-state" data-cmd="link" aria-label="リンク" title="リンク"><span class="msr" aria-hidden="true">link</span></button>
          <button type="button" class="fmt__btn m3-state" data-cmd="hr" aria-label="区切り線" title="区切り線"><span class="msr" aria-hidden="true">horizontal_rule</span></button>
          <span class="fmt__sep"></span>
          <button type="button" class="fmt__btn m3-state" data-cmd="voice" aria-pressed="false" aria-label="音声入力" title="音声入力"><span class="msr" aria-hidden="true">mic</span></button>
          <button type="button" class="fmt__btn m3-state" data-cmd="task" aria-label="選んだ文字を Todo のタスクにする" title="選んだ文字を Todo のタスクにする"><span class="msr" aria-hidden="true">add_task</span></button>
        </div>
        <!-- 表の中にいるとき -->
        <div class="fmt__row fmt__row--table" id="table-tools" hidden>
          <span class="fmt__label">表</span>
          <button type="button" class="text-btn m3-state" data-cmd="row-add"><span class="msr" aria-hidden="true">add</span><span>行</span></button>
          <button type="button" class="text-btn m3-state" data-cmd="col-add"><span class="msr" aria-hidden="true">add</span><span>列</span></button>
          <button type="button" class="text-btn m3-state" data-cmd="row-del"><span class="msr" aria-hidden="true">remove</span><span>行</span></button>
          <button type="button" class="text-btn m3-state" data-cmd="col-del"><span class="msr" aria-hidden="true">remove</span><span>列</span></button>
          <button type="button" class="text-btn tbs-danger m3-state" data-cmd="table-del">表を削除</button>
        </div>
        <!-- 段落のスタイル -->
        <div class="menu fmt__styles" id="style-menu" role="menu" hidden>
          <button type="button" class="m3-state" role="menuitem" data-block="h1"><span class="fs-title">タイトル</span></button>
          <button type="button" class="m3-state" role="menuitem" data-block="h2"><span class="fs-heading">見出し</span></button>
          <button type="button" class="m3-state" role="menuitem" data-block="h3"><span class="fs-sub">小見出し</span></button>
          <button type="button" class="m3-state" role="menuitem" data-block="div"><span>本文</span></button>
          <button type="button" class="m3-state" role="menuitem" data-block="pre"><span class="fs-mono">等幅</span></button>
          <button type="button" class="m3-state" role="menuitem" data-block="blockquote"><span class="fs-quote">引用</span></button>
        </div>
        <input type="file" id="image-file" accept="image/*" multiple hidden>
      </div>

      <footer class="editor__foot" data-i18n-skip><span id="count"></span><span id="dates"></span></footer>
      <!-- ロックしたメモ（閉じているとき） -->
      <div class="editor__locked" id="locked">
        <span class="msr" aria-hidden="true">lock</span>
        <p>このメモはロックされています。</p>
        <button type="button" class="m3-btn m3-state" id="btn-unlock"><span class="msr" aria-hidden="true">key</span><span>パスワードを入力</span></button>
      </div>
      <div class="editor__blank" id="blank">
        <img src="icon.svg" alt="" width="72" height="72">
        <p>メモを選ぶか、新しく書きはじめましょう。</p>
      </div>
    </main>
  </div>

  <!-- スナックバー（「元に戻す」つき） -->
  <div class="snackbar" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" class="text-btn m3-state" id="toast-action" hidden>元に戻す</button></div>

  <!-- Todo のタスクにする・リマインダーの通知（/toolbox/shared/remind.js） -->
  <script src="/toolbox/shared/remind.js"></script>
  <script src="memo.js"></script>
  <script>window.SKI18N && SKI18N.translatePage();</script>
  <!-- 横断検索（Ctrl+K） -->
  <script src="/toolbox/shared/search.js"></script>
  <!-- LINE の中で開いたとき（LINE ミニアプリ）と「LINE で送る」 -->
  <script src="/toolbox/shared/line.js"></script>
  <script src="/toolbox/shared/pwa.js"></script>
  <script src="/assets/maintenance.js" defer></script>
</body>
