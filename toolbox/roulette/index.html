<script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebApplication", "name": "Roulette — SK's Toolbox", "url": "https://sk-hub.jp/toolbox/roulette/", "description": "名前や選択肢を入れて回すルーレット。順番決め・当番・ごはん決めに。この端末に保存されます。", "applicationCategory": "EntertainmentApplication", "operatingSystem": "Web", "inLanguage": "ja", "isAccessibleForFree": true, "offers": {"@type": "Offer", "price": "0", "priceCurrency": "JPY"}, "image": "https://sk-hub.jp/toolbox/roulette/icon-512.png", "isPartOf": {"@type": "WebSite", "name": "SK's Toolbox", "url": "https://sk-hub.jp/toolbox/"}, "author": {"@type": "Person", "name": "SK", "url": "https://sk-hub.jp/"}}</script>
<!-- 多言語: /lang/ で選んだ言語で表示する（/assets/i18n.js。body の最後で translatePage()） -->
<script src="/assets/i18n.js"></script>
<!-- 文字は M PLUS 1、アイコンは Material Symbols（Google のマテリアルデザイン） -->
<script src="/assets/fonts.js" data-fonts="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@300;400;500;700;800&display=swap" data-icons="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"></script>
<link rel="stylesheet" href="/toolbox/shared/m3.css">
<link rel="stylesheet" href="roulette.css">
<!-- SK's Toolbox の共通の設定（テーマ・テーマカラー・動きを減らす…）。設定の画面もここ -->
<script src="/toolbox/shared/settings.js" data-app="roulette"></script>
<!-- マテリアルデザインの部品（波紋・ダイアログ・動き） -->
<script src="/toolbox/shared/m3.js"></script>
<!-- パソコンでアプリとして入れたときのタイトルバー（画面の切りかえでも動かさないよう、最初から入れる） -->
<script src="/toolbox/shared/titlebar.js"></script>
<!-- タイトルバーの真ん中（コマンドバー・アイランドなど。Toolbox の設定で選ぶ） -->
<script src="/toolbox/shared/tbcenter.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <div class="page">
    <header class="app-bar">
      <a class="tb-back m3-state" href="/toolbox/" aria-label="SK's Toolbox に戻る"><span class="msr" aria-hidden="true">arrow_back</span><span>SK's Toolbox</span></a>
      <span class="app-bar__space"></span>
      <button type="button" class="icon-btn m3-state" id="btn-sound" aria-pressed="true" aria-label="音" title="音"><span class="msr" id="sound-icon" aria-hidden="true">volume_up</span></button>
      <button type="button" class="icon-btn m3-state" data-install hidden aria-label="アプリとして追加" title="アプリとして追加"><span class="msr" aria-hidden="true">install_mobile</span></button>
      <button type="button" class="icon-btn m3-state" data-open-settings aria-label="Toolbox の設定" title="Toolbox の設定"><span class="msr" aria-hidden="true">settings</span></button>
      <div class="menu-wrap">
        <button type="button" class="icon-btn m3-state" id="btn-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" aria-label="その他" title="その他"><span class="msr" aria-hidden="true">more_vert</span></button>
        <div class="menu" id="menu" role="menu" hidden>
          <button type="button" class="m3-state" role="menuitem" data-menu="new"><span class="msr" aria-hidden="true">add_circle</span><span>新しいルーレット</span></button>
          <button type="button" class="m3-state" role="menuitem" data-menu="rename"><span class="msr" aria-hidden="true">edit</span><span>名前を変える</span></button>
          <button type="button" class="m3-state" role="menuitem" data-menu="delete"><span class="msr" aria-hidden="true">delete</span><span>このルーレットを削除</span></button>
          <button type="button" class="m3-state" role="menuitem" data-menu="clear-history"><span class="msr" aria-hidden="true">history</span><span>結果の履歴を消す</span></button>
          <button type="button" class="m3-state" role="menuitem" data-menu="export"><span class="msr" aria-hidden="true">download</span><span>バックアップを書き出す</span></button>
          <button type="button" class="m3-state" role="menuitem" data-menu="import"><span class="msr" aria-hidden="true">upload</span><span>バックアップを読み込む</span></button>
        </div>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
    </header>

    <main>
      <div class="head">
        <h1 class="head__title" id="title" data-i18n-skip>Roulette</h1>
        <p class="head__sub" id="sub" data-i18n-skip></p>
      </div>

      <!-- ルーレットの切りかえ -->
      <div class="wheels" id="wheels" role="tablist" aria-label="ルーレットの切りかえ" data-i18n-skip></div>

      <div class="layout">
        <!-- ルーレット（押すか、スペースキーで回す） -->
        <section class="stage" aria-label="ルーレット">
          <div class="wheel-box" id="wheel-box">
            <svg class="pointer" viewBox="0 0 40 48" aria-hidden="true"><path d="M20 46 L4 8 a16 16 0 0 1 32 0 Z"/></svg>
            <div class="wheel" id="wheel" data-i18n-skip></div>
            <button type="button" class="spin m3-state" id="spin"><span class="msr" aria-hidden="true">casino</span><span>回す</span></button>
          </div>
          <p class="result" id="result" aria-live="polite" data-i18n-skip></p>
        </section>

        <!-- 項目 -->
        <section class="side" aria-labelledby="items-title">
          <div class="side__head">
            <h2 id="items-title">項目</h2>
            <button type="button" class="text-btn m3-state" id="btn-shuffle"><span class="msr" aria-hidden="true">shuffle</span><span>並べかえ</span></button>
          </div>
          <ul class="items" id="items" data-i18n-skip></ul>
          <form class="add" id="add" autocomplete="off">
            <span class="msr" aria-hidden="true">add</span>
            <input type="text" id="add-text" placeholder="項目を追加（改行で複数）" aria-label="項目を追加" maxlength="60" enterkeyhint="done">
            <button type="submit" class="icon-btn m3-state" aria-label="追加" title="追加"><span class="msr" aria-hidden="true">arrow_upward</span></button>
          </form>
          <label class="opt m3-state"><span class="opt__text"><span>当たったものを次から外す</span><small>順番決め・当番決めに</small></span><input type="checkbox" class="tbs-switch" role="switch" id="opt-remove"></label>
          <button type="button" class="text-btn m3-state restore" id="btn-restore" hidden><span class="msr" aria-hidden="true">undo</span><span id="restore-label" data-i18n-skip></span></button>

          <h2 class="side__title">結果の履歴</h2>
          <ol class="history" id="history" data-i18n-skip></ol>
          <p class="history__empty" id="history-empty">まだ回していません。</p>
        </section>
      </div>
      <p class="note">ルーレットはこの端末のブラウザに保存されます（オンライン同期は任意）。</p>
    </main>
  </div>

  <!-- 結果（大きく出す） -->
  <div class="win" id="win" role="dialog" aria-modal="true" aria-labelledby="win-text" hidden>
    <div class="win__card">
      <p class="win__label">結果</p>
      <p class="win__text" id="win-text" data-i18n-skip></p>
      <div class="win__actions">
        <button type="button" class="text-btn m3-state" id="win-close">閉じる</button>
        <button type="button" class="m3-btn m3-btn--tonal m3-state" id="win-remove" hidden><span class="msr" aria-hidden="true">remove_circle</span><span>外してもう一度</span></button>
        <button type="button" class="m3-btn m3-state" id="win-again"><span class="msr" aria-hidden="true">casino</span><span>もう一度</span></button>
      </div>
    </div>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
  </div>

  <!-- スナックバー（「元に戻す」つき） -->
  <div class="snackbar" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" class="text-btn m3-state" id="toast-action" hidden>元に戻す</button></div>

  <!-- リマインダーとアラームの通知・通知のボタン・アイコンの数字（/toolbox/shared/remind.js） -->
  <script src="/toolbox/shared/remind.js"></script>
  <script src="roulette.js"></script>
  <script>window.SKI18N && SKI18N.translatePage();</script>
  <!-- 横断検索（Ctrl+K） -->
  <script src="/toolbox/shared/search.js"></script>
  <!-- LINE の中で開いたとき（LINE ミニアプリ）と「LINE で送る」 -->
  <script src="/toolbox/shared/line.js"></script>
  <script src="/toolbox/shared/pwa.js"></script>
  <script src="/assets/maintenance.js" defer></script>
</body>
</html>
