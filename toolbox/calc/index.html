<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script src="/assets/coming-soon.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="すっきり見やすい電卓。計算の履歴は、この端末に保存されます。">
<meta name="theme-color" content="#f9f9ff" id="theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calc">
<title>Calc — 電卓・関数電卓 | SK's Toolbox</title>
<!-- 検索とシェアのための情報（正式な URL・カード・アプリの情報） -->
<link rel="canonical" href="https://sk-hub.jp/toolbox/calc/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SK's Toolbox">
<meta property="og:locale" content="ja_JP">
<meta property="og:title" content="Calc — 電卓・関数電卓 | SK&#x27;s Toolbox">
<meta property="og:description" content="すっきり見やすい電卓。計算の履歴は、この端末に保存されます。">
<meta property="og:url" content="https://sk-hub.jp/toolbox/calc/">
<meta property="og:image" content="https://sk-hub.jp/toolbox/calc/icon-512.png">
<meta name="twitter:card" content="summary">
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebApplication", "name": "Calc — SK's Toolbox", "url": "https://sk-hub.jp/toolbox/calc/", "description": "すっきり見やすい電卓。計算の履歴は、この端末に保存されます。", "applicationCategory": "UtilitiesApplication", "operatingSystem": "Web", "inLanguage": "ja", "isAccessibleForFree": true, "offers": {"@type": "Offer", "price": "0", "priceCurrency": "JPY"}, "image": "https://sk-hub.jp/toolbox/calc/icon-512.png", "isPartOf": {"@type": "WebSite", "name": "SK's Toolbox", "url": "https://sk-hub.jp/toolbox/"}, "author": {"@type": "Person", "name": "SK", "url": "https://sk-hub.jp/"}}</script>
<!-- 多言語: /lang/ で選んだ言語で表示する（/assets/i18n.js。body の最後で translatePage()） -->
<script src="/assets/i18n.js"></script>
<!-- 文字は M PLUS 1、アイコンは Material Symbols（Google のマテリアルデザイン） -->
<script src="/assets/fonts.js" data-fonts="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@300;400;500;700&display=swap" data-icons="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"></script>
<link rel="stylesheet" href="/toolbox/shared/m3.css">
<link rel="stylesheet" href="calc.css">
<!-- SK's Toolbox の共通の設定（テーマ・テーマカラー・動きを減らす…）。設定の画面もここ -->
<script src="/toolbox/shared/settings.js" data-app="calc"></script>
<!-- マテリアルデザインの部品（波紋・ダイアログ・動き） -->
<script src="/toolbox/shared/m3.js"></script>
<!-- パソコンでアプリとして入れたときのタイトルバー（画面の切りかえでも動かさないよう、最初から入れる） -->
<script src="/toolbox/shared/titlebar.js"></script>
<!-- タイトルバーの真ん中（コマンドバー・アイランドなど。Toolbox の設定で選ぶ） -->
<script src="/toolbox/shared/tbcenter.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <div class="layout">
    <main class="calc">
      <!-- トップアプリバー -->
      <header class="app-bar">
        <a class="tb-back m3-state" href="/toolbox/" aria-label="SK's Toolbox に戻る"><span class="msr" aria-hidden="true">arrow_back</span><span>SK's Toolbox</span></a>
        <span class="app-bar__space"></span>
        <button type="button" class="icon-btn m3-state" data-install hidden aria-label="アプリとして追加" title="アプリとして追加"><span class="msr" aria-hidden="true">install_mobile</span></button>
        <button type="button" class="icon-btn m3-state" id="btn-sci" aria-pressed="false" aria-label="関数電卓" title="関数電卓"><span class="msr" aria-hidden="true">function</span></button>
        <button type="button" class="icon-btn m3-state" data-open-settings aria-label="Toolbox の設定" title="Toolbox の設定"><span class="msr" aria-hidden="true">settings</span></button>
        <button type="button" class="icon-btn m3-state history-toggle" id="btn-history" aria-controls="history" aria-expanded="false" aria-label="計算の履歴" title="計算の履歴"><span class="msr" aria-hidden="true">history</span></button>
      </header>

      <section class="display">
        <div class="display__expr" id="expr" data-i18n-skip></div>
        <div class="display__row">
          <button type="button" class="display__result" id="result" aria-live="polite" data-i18n-skip></button>
        </div>
      </section>

      <!-- 関数電卓のキー（上の「関数電卓」ボタンで出す） -->
      <div class="sci-keys" id="sci-keys" role="group" aria-label="関数">
        <button type="button" class="key key--sci key--angle m3-state" data-k="angle" data-i18n-skip>DEG</button>
        <button type="button" class="key key--sci m3-state" data-k="fn:sin" data-i18n-skip>sin</button>
        <button type="button" class="key key--sci m3-state" data-k="fn:cos" data-i18n-skip>cos</button>
        <button type="button" class="key key--sci m3-state" data-k="fn:tan" data-i18n-skip>tan</button>
        <button type="button" class="key key--sci m3-state" data-k="π" aria-label="円周率">π</button>
        <button type="button" class="key key--sci m3-state" data-k="fn:ln" data-i18n-skip>ln</button>
        <button type="button" class="key key--sci m3-state" data-k="fn:log" data-i18n-skip>log</button>
        <button type="button" class="key key--sci m3-state" data-k="fn:√" aria-label="平方根">√</button>
        <button type="button" class="key key--sci m3-state" data-k="x2" aria-label="2 乗">x²</button>
        <button type="button" class="key key--sci m3-state" data-k="^" aria-label="累乗">xʸ</button>
        <button type="button" class="key key--sci m3-state" data-k="e" aria-label="ネイピア数">e</button>
        <button type="button" class="key key--sci m3-state" data-k="!" aria-label="階乗">x!</button>
        <button type="button" class="key key--sci m3-state" data-k="inv" aria-label="逆数">1/x</button>
        <button type="button" class="key key--sci m3-state" data-k="(" aria-label="開きかっこ">(</button>
        <button type="button" class="key key--sci m3-state" data-k=")" aria-label="閉じかっこ">)</button>
      </div>
      <div class="keys" id="keys" role="group" aria-label="キー">
        <button type="button" class="key m3-state key--clear" data-k="clear" aria-label="すべて消去">AC</button>
        <button type="button" class="key m3-state key--fn" data-k="paren" aria-label="かっこ">( )</button>
        <button type="button" class="key m3-state key--fn" data-k="%" aria-label="パーセント">%</button>
        <button type="button" class="key m3-state key--op" data-k="/" aria-label="割る">÷</button>
        <button type="button" class="key m3-state" data-k="7">7</button>
        <button type="button" class="key m3-state" data-k="8">8</button>
        <button type="button" class="key m3-state" data-k="9">9</button>
        <button type="button" class="key m3-state key--op" data-k="*" aria-label="掛ける">×</button>
        <button type="button" class="key m3-state" data-k="4">4</button>
        <button type="button" class="key m3-state" data-k="5">5</button>
        <button type="button" class="key m3-state" data-k="6">6</button>
        <button type="button" class="key m3-state key--op" data-k="-" aria-label="引く">−</button>
        <button type="button" class="key m3-state" data-k="1">1</button>
        <button type="button" class="key m3-state" data-k="2">2</button>
        <button type="button" class="key m3-state" data-k="3">3</button>
        <button type="button" class="key m3-state key--op" data-k="+" aria-label="足す">+</button>
        <button type="button" class="key m3-state" data-k="0">0</button>
        <button type="button" class="key m3-state" data-k="." aria-label="小数点">.</button>
        <button type="button" class="key m3-state" data-k="back" aria-label="1 文字消す"><span class="msr" aria-hidden="true">backspace</span></button>
        <button type="button" class="key m3-state key--eq" data-k="=" aria-label="計算する">=</button>
      </div>
    </main>

    <div class="scrim" id="scrim" hidden></div>
    <!-- 履歴（広い画面: 右のパネル。せまい画面: ボトムシート） -->
    <aside class="history" id="history" aria-labelledby="history-title">
      <div class="history__handle" aria-hidden="true"></div>
      <header class="history__head">
        <h2 id="history-title">履歴</h2>
        <button type="button" class="text-btn m3-state" id="btn-clear-history">すべて消去</button>
        <button type="button" class="icon-btn m3-state history__close" id="btn-history-close" aria-label="閉じる"><span class="msr" aria-hidden="true">close</span></button>
      </header>
      <ol class="history__list" id="history-list" data-i18n-skip></ol>
      <div class="history__empty" id="history-empty">
        <span class="msr" aria-hidden="true">calculate</span>
        <p>まだ計算していません。</p>
      </div>
      <p class="history__note">履歴はこの端末のブラウザに保存されます。</p>
    </aside>
  </div>

  <!-- スナックバー -->
  <p class="snackbar" id="toast" role="status" aria-live="polite"><span id="toast-text"></span></p>

  <!-- リマインダーとアラームの通知・通知のボタン・アイコンの数字（/toolbox/shared/remind.js） -->
  <script src="/toolbox/shared/remind.js"></script>
  <script src="calc.js"></script>
  <script>window.SKI18N && SKI18N.translatePage();</script>
  <!-- 横断検索（Ctrl+K） -->
  <script src="/toolbox/shared/search.js"></script>
  <!-- LINE の中で開いたとき（LINE ミニアプリ）と「LINE で送る」 -->
  <script src="/toolbox/shared/line.js"></script>
  <script src="/toolbox/shared/pwa.js"></script>
  <script src="/assets/maintenance.js" defer></script>
</body>
